<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的书签</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="newtab-container">
    <header class="header">
      <h1>我的书签</h1>
      <div class="actions">
        <button id="add-bookmark-btn" class="add-btn">
          <span class="icon">+</span>
          添加书签
        </button>
      </div>
    </header>

    <main class="main-content">
      <!-- 左侧分组边栏 -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>分组</h2>
          <button id="add-group-btn" class="add-group-btn" title="添加分组">+</button>
        </div>
        <div id="groups-list" class="groups-list">
          <!-- 分组列表动态生成 -->
        </div>
      </aside>

      <!-- 右侧主内容区 -->
      <div class="main-area">
        <div class="sort-options">
          <button id="sort-custom" class="sort-btn">自定义排序</button>
          <button id="sort-frequency" class="sort-btn active">按访问频次</button>
        </div>

        <div id="bookmarks-grid" class="bookmarks-grid">
          <!-- 书签卡片将通过JavaScript动态生成 -->
        </div>
      </div>
    </main>

    <!-- 添加书签弹窗 -->
    <div id="add-modal" class="modal-overlay" style="display: none;">
      <div class="modal">
        <h2>添加书签</h2>
        <form id="add-bookmark-form">
          <div class="form-group">
            <label for="bookmark-title">标题</label>
            <input
              id="bookmark-title"
              type="text"
              required
              placeholder="输入书签标题"
            />
          </div>
          <div class="form-group">
            <label for="bookmark-url">网址</label>
            <input
              id="bookmark-url"
              type="url"
              required
              placeholder="https://example.com"
            />
          </div>
          <div class="form-group">
            <label for="bookmark-group">分组</label>
            <select id="bookmark-group" required>
              <!-- 分组选项动态生成 -->
            </select>
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-add">取消</button>
            <button type="submit">添加</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 添加分组弹窗 -->
    <div id="add-group-modal" class="modal-overlay" style="display: none;">
      <div class="modal">
        <h2>添加分组</h2>
        <form id="add-group-form">
          <div class="form-group">
            <label for="group-name">分组名称</label>
            <input
              id="group-name"
              type="text"
              required
              placeholder="输入分组名称"
            />
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-add-group">取消</button>
            <button type="submit">添加</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
