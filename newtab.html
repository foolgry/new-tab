<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的书签</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="newtab-container">
    <header class="header" id="app-header">
      <div class="header-dynamic" id="header-dynamic">
        <!-- 顶栏内容由 JS 渲染 -->
      </div>
    </header>

    <main class="main-content" id="main-content">
      <!-- 书签内容由 JS 渲染 -->
    </main>

    <!-- 添加书签弹窗 -->
    <div id="add-modal" class="modal-overlay" style="display: none;">
      <div class="modal">
        <h2>添加书签</h2>
        <form id="add-bookmark-form">
          <div class="form-group">
            <label for="bookmark-title">标题</label>
            <input
              id="bookmark-title"
              type="text"
              required
              placeholder="输入书签标题"
            />
          </div>
          <div class="form-group">
            <label for="bookmark-url">网址</label>
            <input
              id="bookmark-url"
              type="url"
              required
              placeholder="https://example.com"
            />
          </div>
          <div class="form-group">
            <label for="bookmark-group">分组</label>
            <select id="bookmark-group" required>
              <!-- 分组选项动态生成 -->
            </select>
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-add">取消</button>
            <button type="submit">添加</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 添加分组弹窗 -->
    <div id="add-group-modal" class="modal-overlay" style="display: none;">
      <div class="modal">
        <h2>添加分组</h2>
        <form id="add-group-form">
          <div class="form-group">
            <label for="group-name">分组名称</label>
            <input
              id="group-name"
              type="text"
              required
              placeholder="输入分组名称"
            />
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-add-group">取消</button>
            <button type="submit">添加</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 导入文件（持久存在） -->
    <input id="import-file" type="file" accept=".json,application/json" style="display:none">
  </div>

  <script src="newtab.js"></script>
</body>
</html>
