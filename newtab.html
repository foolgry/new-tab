<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="newtabTitle">My Bookmarks</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="newtab-container">
    <header class="header" id="app-header">
      <div class="header-dynamic" id="header-dynamic">
        <!-- 顶栏内容由 JS 渲染 -->
      </div>
    </header>

    <main class="main-content" id="main-content">
      <!-- 书签内容由 JS 渲染 -->
    </main>

    <!-- 添加书签弹窗 -->
    <div id="add-modal" class="modal-overlay" style="display: none;">
      <div class="modal">
        <h2 data-i18n="addBookmarkTitle">Add Bookmark</h2>
        <form id="add-bookmark-form">
          <div class="form-group">
            <label for="bookmark-title" data-i18n="formTitle">Title</label>
            <input
              id="bookmark-title"
              type="text"
              required
              placeholder="Enter bookmark title"
              data-i18n-placeholder="placeholderBookmarkTitle"
            />
          </div>
          <div class="form-group">
            <label for="bookmark-url" data-i18n="formUrl">URL</label>
            <input
              id="bookmark-url"
              type="url"
              required
              placeholder="https://example.com"
            />
          </div>
          <div class="form-group">
            <label for="bookmark-group" data-i18n="formGroup">Group</label>
            <select id="bookmark-group" required>
              <!-- 分组选项动态生成 -->
            </select>
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-add" data-i18n="cancel">Cancel</button>
            <button type="submit" data-i18n="add">Add</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 添加分组弹窗 -->
    <div id="add-group-modal" class="modal-overlay" style="display: none;">
      <div class="modal">
        <h2 data-i18n="addGroupTitle">Add Group</h2>
        <form id="add-group-form">
          <div class="form-group">
            <label for="group-name" data-i18n="formGroupName">Group name</label>
            <input
              id="group-name"
              type="text"
              required
              placeholder="Enter group name"
              data-i18n-placeholder="placeholderGroupName"
            />
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-add-group" data-i18n="cancel">Cancel</button>
            <button type="submit" data-i18n="add">Add</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 云同步设置弹窗 -->
    <div id="sync-modal" class="modal-overlay" style="display: none;">
      <div class="modal modal-sync">
        <h2 data-i18n="syncModalTitle">Cloud Sync (WebDAV)</h2>
        <form id="sync-form">
          <div class="form-group">
            <label for="sync-provider" data-i18n="syncProvider">Provider</label>
            <select id="sync-provider">
              <!-- 服务商选项动态生成 -->
            </select>
          </div>
          <div class="form-group">
            <label for="sync-url" data-i18n="syncUrl">WebDAV address</label>
            <input id="sync-url" type="url" required placeholder="https://example.com/dav/">
            <p class="form-hint" id="sync-url-hint"></p>
          </div>
          <div class="form-group">
            <label for="sync-username" data-i18n="syncUsername">Account</label>
            <input id="sync-username" type="text" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label for="sync-password" data-i18n="syncPassword">App password / key</label>
            <input id="sync-password" type="password" autocomplete="current-password" placeholder="Leave empty to keep the saved password" data-i18n-placeholder="syncPasswordPlaceholder">
          </div>
          <div class="form-group">
            <label for="sync-filename" data-i18n="syncFilename">Sync file name</label>
            <input id="sync-filename" type="text" placeholder="newtab-bookmarks.json">
          </div>
          <p class="sync-note" data-i18n="syncNote">The first sync merges local and remote bookmarks (deduplicated by URL) and never overwrites either side. The account and password are stored only in the local browser; use the app-specific password provided by your service.</p>
          <div class="sync-status" id="sync-status"></div>
          <div class="form-actions form-actions-split">
            <button type="button" id="sync-disable" data-i18n="syncDisable">Disable sync</button>
            <button type="button" id="sync-test" data-i18n="syncTest">Test connection</button>
            <button type="submit" id="sync-save" data-i18n="syncSave">Save and sync</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 导入文件（持久存在） -->
    <input id="import-file" type="file" accept=".json,application/json" style="display:none">
  </div>

  <script src="sync-core.js"></script>
  <script src="i18n.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
