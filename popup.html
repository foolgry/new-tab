<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="popupTitle">Add to Bookmarks</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h2 data-i18n="addToBookmarks">Add to bookmarks</h2>
    </header>

    <div id="current-page" class="current-page">
      <div class="page-info">
        <div class="page-favicon">
          <img id="page-favicon" src="" alt="Page icon" data-i18n-alt="pageIconAlt">
        </div>
        <div class="page-details">
          <div id="page-title" class="page-title" data-i18n="loading">Loading...</div>
          <div id="page-url" class="page-url" data-i18n="loading">Loading...</div>
        </div>
      </div>
    </div>

    <form id="add-form" class="add-form">
      <div class="form-group">
        <label for="bookmark-title" data-i18n="formTitle">Title</label>
        <input
          id="bookmark-title"
          type="text"
          required
          placeholder="Enter bookmark title"
          data-i18n-placeholder="placeholderBookmarkTitle"
        />
      </div>

      <div class="form-group">
        <label for="bookmark-url" data-i18n="formUrl">URL</label>
        <input
          id="bookmark-url"
          type="url"
          required
          placeholder="https://example.com"
        />
      </div>

      <div class="form-group">
        <label for="bookmark-group" data-i18n="formGroup">Group</label>
        <select id="bookmark-group" required>
          <!-- 分组选项动态生成 -->
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-btn" class="add-btn" data-i18n="addToBookmarks">
          Add to bookmarks
        </button>
      </div>
    </form>

    <div id="message" class="message" style="display: none;"></div>

    <div class="popup-footer">
      <button id="view-bookmarks" class="view-bookmarks-btn" data-i18n="viewAllBookmarks">
        View all bookmarks
      </button>
    </div>
  </div>

  <script src="sync-core.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
